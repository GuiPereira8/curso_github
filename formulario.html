<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>
  <body>
    <h1>Crie sua conta</h1>
    <form action="#">
      <div>
        <label for="inNome">Nome Completo:</label>
        <input type="text" name="inNome" id="inNome" />
      </div>
      <br />
      <div>
        <label for="inEmail">Email:</label>
        <input type="email" name="inEmail" id="inEmail" />
      </div>
      <br />
      <div>
        <label for="inSenha">Senha:</label>
        <input type="password" name="inSenha" id="inSenha" />
      </div>
      <br />
      <input type="button" value="Cadastrar" />
    </form>
    <!-- Formulário finalizado com sucesso. -->
  </body>
</html>
